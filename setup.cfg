[metadata]
name = piper-tts-server
version = 1.0.0
description = Resident Piper TTS server over a Unix socket with LRU cache and PCM streaming for speech-dispatcher
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL-3.0-or-later
license_files = LICENSE

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    piper-tts>=1.8.0

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    piper-tts-server = piper_tts_server.__main__:main
    piper-tts-client = piper_tts_server.client:main
